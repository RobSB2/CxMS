name: Archive Traffic Data

on:
  schedule:
    # Every Monday at 8:00 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  archive-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch traffic data
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          REPO="RobSB2/CxMS"
          DATE=$(date -u +"%Y-%m-%d")

          # Fetch clones and views
          CLONES=$(gh api "repos/$REPO/traffic/clones" 2>/dev/null || echo '{"count":0,"uniques":0,"clones":[]}')
          VIEWS=$(gh api "repos/$REPO/traffic/views" 2>/dev/null || echo '{"count":0,"uniques":0,"views":[]}')

          # Extract totals (14-day window)
          CLONE_COUNT=$(echo "$CLONES" | jq '.count')
          CLONE_UNIQUES=$(echo "$CLONES" | jq '.uniques')
          VIEW_COUNT=$(echo "$VIEWS" | jq '.count')
          VIEW_UNIQUES=$(echo "$VIEWS" | jq '.uniques')

          # Build snapshot
          SNAPSHOT=$(jq -n \
            --arg date "$DATE" \
            --argjson clone_count "$CLONE_COUNT" \
            --argjson clone_uniques "$CLONE_UNIQUES" \
            --argjson view_count "$VIEW_COUNT" \
            --argjson view_uniques "$VIEW_UNIQUES" \
            --argjson clones_daily "$(echo "$CLONES" | jq '.clones')" \
            --argjson views_daily "$(echo "$VIEWS" | jq '.views')" \
            '{
              date: $date,
              clones_14d: { count: $clone_count, uniques: $clone_uniques },
              views_14d: { count: $view_count, uniques: $view_uniques },
              daily_clones: $clones_daily,
              daily_views: $views_daily
            }')

          # Append to log (dedup by date)
          LOG_FILE="traffic/traffic-log.json"
          EXISTING=$(cat "$LOG_FILE")
          UPDATED=$(echo "$EXISTING" | jq --argjson snap "$SNAPSHOT" '
            if (.snapshots | map(.date) | index($snap.date)) then
              .snapshots |= map(if .date == $snap.date then $snap else . end)
            else
              .snapshots += [$snap]
            end
            | .last_updated = $snap.date
          ')
          echo "$UPDATED" | jq '.' > "$LOG_FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic/traffic-log.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: archive traffic data $(date -u +%Y-%m-%d)"
          git push
